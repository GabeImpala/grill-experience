<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J&J Grill Masters</title>
<meta name="description" content="Live fire cooking & recipes by J&J Grill Masters — DFW, TX.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --char:  #1A1410;
    --coal:  #241C15;
    --ember: #C8521A;
    --cream: #F5EFE4;
    --smoke: #8C7B6B;
    --white: #FDFAF6;
    --line:  rgba(200,180,150,0.15);
  }
  body {
    background: var(--char);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,82,26,0.12), transparent), var(--char);
  }

  /* PROFILE */
  .profile { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; }
  .avatar-wrap {
    width: 110px; height: 110px; border-radius: 50%;
    overflow: hidden; margin-bottom: 18px;
    border: 3px solid var(--ember);
    box-shadow: 0 0 24px rgba(200,82,26,0.3);
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .profile-name {
    font-family: 'Playfair Display', serif;
    font-size: 24px; font-weight: 700; color: var(--white);
    margin-bottom: 4px; text-align: center;
  }
  .profile-name span { color: var(--ember); }
  .profile-handle { font-size: 13px; color: var(--smoke); font-weight: 500; margin-bottom: 12px; }
  .profile-bio {
    font-size: 14px; color: var(--cream); text-align: center;
    max-width: 300px; line-height: 1.7; font-weight: 300; margin-bottom: 6px;
  }
  .profile-location { font-size: 12px; color: var(--smoke); }

  /* LINKS */
  .links { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .link-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px;
    background: var(--coal);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none; color: var(--cream);
    transition: border-color .2s, background .2s, transform .15s;
    position: relative; overflow: hidden;
  }
  .link-btn:hover { border-color: var(--ember); background: #2A201A; transform: translateY(-1px); }
  .link-btn::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--ember); transform: scaleY(0); transform-origin: center; transition: transform .2s;
  }
  .link-btn:hover::before { transform: scaleY(1); }
  .link-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; background: rgba(200,82,26,0.12);
  }
  .link-text { flex: 1; }
  .link-label { font-size: 11px; color: var(--smoke); font-weight: 400; display: block; margin-bottom: 1px; }
  .link-title { font-size: 14px; font-weight: 600; color: var(--white); }
  .link-arrow { color: var(--smoke); font-size: 15px; }

  /* GALLERY */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--smoke);
    margin-bottom: 12px; text-align: center;
    width: 100%; max-width: 420px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::before, .section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--line);
  }
  .photo-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 4px; width: 100%; max-width: 420px; margin-bottom: 32px;
  }
  .photo-item { aspect-ratio: 1; overflow: hidden; border-radius: 8px; }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
  .photo-item:hover img { transform: scale(1.06); }

  /* FOOTER */
  .footer { font-size: 12px; color: var(--smoke); text-align: center; line-height: 1.8; }
</style>
</head>
<body>

<div class="profile">
  <div class="avatar-wrap">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_240/v1790561168/YoChef_vdg2ul.png" alt="J&J Grill Masters">
  </div>
  <h1 class="profile-name">J&amp;J <span>Grill Masters</span></h1>
  <div class="profile-handle">@jjgrillmasters</div>
  <p class="profile-bio">🔥 Live fire cooking &amp; recipes. Real charcoal. Real flavor. No shortcuts.</p>
  <div class="profile-location">📍 Dallas–Fort Worth, TX</div>
</div>

<div class="links">
  <a href="https://instagram.com/jjgrillmasters" target="_blank" class="link-btn">
    <div class="link-icon">📸</div>
    <div class="link-text">
      <span class="link-label">Follow us on</span>
      <span class="link-title">Instagram</span>
    </div>
    <span class="link-arrow">→</span>
  </a>

  <a href="https://tiktok.com/@jjgrillmasters" target="_blank" class="link-btn">
    <div class="link-icon">🎵</div>
    <div class="link-text">
      <span class="link-label">Watch on</span>
      <span class="link-title">TikTok</span>
    </div>
    <span class="link-arrow">→</span>
  </a>

  <a href="https://youtube.com/@jjgrillmasters" target="_blank" class="link-btn">
    <div class="link-icon">▶️</div>
    <div class="link-text">
      <span class="link-label">Videos on</span>
      <span class="link-title">YouTube</span>
    </div>
    <span class="link-arrow">→</span>
  </a>
</div>

<div class="section-label">Recent Cooks</div>

<div class="photo-grid">
  <div class="photo-item">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_300/v1785186684/Picanha_Temp_hhzovl.jpg" alt="Picanha">
  </div>
  <div class="photo-item">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_300/v1785186684/Carbon_Zoomed_Im_zeuwts.jpg" alt="Charcoal">
  </div>
  <div class="photo-item">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_300/v1785186685/Jalapenos_Zommed_In_lqg1cb.jpg" alt="Jalapeños">
  </div>
  <div class="photo-item">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_300/v1785186685/Chicken_Violado_xeskks.jpg" alt="Chicken">
  </div>
  <div class="photo-item">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_300/v1785186686/Shrimp_pezdfd.jpg" alt="Shrimp">
  </div>
  <div class="photo-item">
    <img src="https://res.cloudinary.com/kg48bgfc/image/upload/q_auto,f_auto,w_300/v1790561168/YoChef_vdg2ul.png" alt="Chef">
  </div>
</div>

<div class="footer">© 2026 J&amp;J Grill Masters · Dallas–Fort Worth, TX</div>

</body>
</html>
